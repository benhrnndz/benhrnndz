  <text x="106" y="92" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5">Long-form YouTube, VSLs, narrative short films &amp; vertical 9:16 series</text>
  <text x="106" y="110" fill="#94A3B8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="12.5">cut with a filmmaker's eye in DaVinci Resolve &amp; CapCut Pro.</text>

